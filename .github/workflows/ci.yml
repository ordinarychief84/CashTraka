name: CI

# Runs on every PR + every push to main. Gates a merge on:
#   1. Prisma client + schema validation
#   2. TypeScript strict mode (now enforced via next.config.js)
#   3. Vitest unit tests for critical services
#   4. ESLint
#
# We don't run `npm run build` here because that triggers `prisma db push`
# against the dev DB and would burn CI minutes. The Vercel preview build
# does the full build per branch — CI's job is to catch regressions
# *before* a deploy is provisioned.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel older runs on the same branch when a new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Test · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck (strict)
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test -- --run

      - name: Lint
        # ESLint warnings are noisy in this repo; surface them but do not
        # fail the build. Type errors above are the real gate.
        continue-on-error: true
        run: npm run lint
