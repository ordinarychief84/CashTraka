name: CI

# Runs on every PR + every push to main. Gates a merge on:
#   1. Prisma client + schema validation
#   2. TypeScript strict mode (now enforced via next.config.js)
#   3. Vitest unit tests for critical services
#   4. ESLint
#
# We don't run `npm run build` here because that triggers `prisma db push`
# against the dev DB and would burn CI minutes. The Vercel preview build
# does the full build per branch — CI's job is to catch regressions
# *before* a deploy is provisioned.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel older runs on the same branch when a new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Test · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # SHA-pinned (not @v4) per CSO finding #7. Tags are mutable; if
      # the actions/* org is ever compromised, an attacker could retag
      # v4 to point at malicious code. Commit SHAs are immutable.
      # Bump via Dependabot or stepsecurity.io periodically.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.5.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck (strict)
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test -- --run

      # Lint — fails build on ERRORS, ignores WARNINGS. Per CSO #10:
      # security-critical rules (`react/no-danger`, `no-eval`,
      # `no-implied-eval`, `no-new-func`, `no-script-url`) are set to
      # `error` in .eslintrc.json — they gate the build. Style warnings
      # (jsx-key, etc.) stay at `warn` and don't block, since
      # `--max-warnings=99999` is wired into the lint script.
      - name: Lint
        run: npm run lint
